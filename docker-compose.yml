name: llmpatients-agent

services:
  # FastAPI patient/orchestrator backend
  api:
    #image: ${LLMPATIENTS_AGENT_IMAGE:-llmpatients-agent:latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${LLMPATIENTS_AGENT_BASE_IMAGE:-intel/vllm}
    init: true
    ports:
      - "${LLMPATIENTS_AGENT_PORT:-8000}:8000"
    privileged: true
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${LLMPATIENTS_AGENT_RENDER_GROUP:-110}"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./tests/runs:/app/tests/runs
      - /home/arc/vertex-ai-api-key.json:/app/config/vertex-ai-api-key.json:ro
      - huggingface-cache:/root/.cache/huggingface
    restart: unless-stopped

volumes:
  huggingface-cache:
