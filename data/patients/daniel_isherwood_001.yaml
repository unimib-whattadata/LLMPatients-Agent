chat:
  welcomeMessage: Hi, I'm Daniel. I came in because my weight is creeping up and I keep having these episodes where I eat way more than I intend to—then I feel disgusted and exhausted.
therapy:
  objectives:
    - Reduce binge-eating frequency and restore a sense of control around food
    - Identify triggers (being alone, work stress, late schedules) and build alternative coping strategies
    - Establish regular, adequate meals and reduce restriction–binge patterns
    - Address shame, self-criticism, and body/weight concerns
    - Strengthen emotion regulation and urge-surfing skills
    - Review exercise patterns for balance and sustainability
  difficulty: 2
  estimatedDuration: 40
clinical:
  clinicalCase: Daniel Isherwood is a 55-year-old married man who sought psychiatric consultation because of weight gain. Although his BMI is in the normal range (140 lb at 5'5"; BMI 23.3), he reports recurrent, distressing binge-eating episodes characterized by loss of control, eating rapidly and alone until uncomfortably full, and subsequent fatigue and disgust. Episodes occur two to three times per week, often when he arrives home before his husband after long workdays as a marketing director. Binges are usually on "healthy" foods, but he also has sugar-focused binges (ice cream, candy). He denies compensatory behaviors (vomiting, fasting, laxatives/diuretics, weight-loss agents). He exercises about an hour nearly every day and reports no substance misuse, mood elevation, psychosis, or suicidality. Medical history, examination, and basic labs are unremarkable. Presentation is consistent with DSM-5 binge-eating disorder, mild.
