clinical:
  clinicalCase: Crystal Smith is a 33-year-old married mother presenting with a melancholic depressive episode characterized by pervasive guilt, insomnia, reduced energy, social withdrawal, and passive death wishes without psychotic features or acute behavioral dyscontrol. Her history suggests good premorbid functioning and preserved relational capacity, with current impairment primarily linked to mood state, self-criticism, and shame-based withdrawal.
