id: snap2
name: "Schedule for Nonadaptive and Adaptive Personality – 2nd Edition (SNAP-2)"
description: >
  390 True/False items assessing personality traits and disorders.
  Respond T (True or Mostly True) or F (False or Mostly False).
  Subscale scoring requires the SNAP-2 scoring key (Clark, 2014), which is not
  included in the item booklet. Raw T/F answers are stored; subscale computation
  requires the manual.
  Copyright 2014, Lee Anna Clark. All rights reserved.
time_frame: "yourself in general"
scale:
  type: choice
  options: ["T", "F"]
  labels:
    T: "True or Mostly True"
    F: "False or Mostly False"
batch_size: 3
